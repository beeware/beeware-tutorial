[project]
copyright = "© Russell Keith-Magee"
not_in_nav = """
/index.md
"""
nav = [
    { "Tutorial 0 - Let's get set up!" = "tutorial/tutorial-0.md" },
    { "Tutorial 1 - Your first app" = "tutorial/tutorial-1.md" },
    { "Tutorial 2 - Making it interesting" = "tutorial/tutorial-2.md" },
    { "Tutorial 3 - Packaging for distribution" = "tutorial/tutorial-3.md" },
    { "Tutorial 4 - Updating your application" = "tutorial/tutorial-4.md" },
    { "Tutorial 5 - Taking it mobile" = [
        { "Tutorial 5 - Taking it mobile" = "tutorial/tutorial-5/index.md" },
        { "Tutorial 5 - Taking it mobile: Android" = "tutorial/tutorial-5/android.md" },
        { "Tutorial 5 - Taking it mobile: iOS" = "tutorial/tutorial-5/iOS.md" },
    ] },
    { "Tutorial 6 - Put it on the web!" = "tutorial/tutorial-6.md" },
    { "Tutorial 7 - Get this (third-)party started" = "tutorial/tutorial-7.md" },
    { "Tutorial 8 - Making it Smooooth" = "tutorial/tutorial-8.md" },
    { "Going further" = [
        { "Going further" = "tutorial/topics/index.md" },
        { "Customizing icons" = "tutorial/topics/custom-icons.md" },
        { "Using the camera" = "tutorial/topics/camera-access.md" },
        { "Testing times" = "tutorial/topics/testing.md" },
    ] },
]

[project.validation]
omitted_files = "warn"
absolute_links = "relative_to_docs"
anchors = "warn"
unrecognized_links = "warn"

[project.extra]
project_name = "beeware-tutorial"
alternate = [
    { name = "English", link = "/en/", lang = "en" },
    { name = "Deutsch", link = "/de/", lang = "de" },
    { name = "Español", link = "/es/", lang = "es" },
    { name = "Français", link = "/fr/", lang = "fr" },
    { name = "Italiano", link = "/it/", lang = "it" },
    { name = "Português", link = "/pt/", lang = "pt" },
    { name = "中文(简体)", link = "/zh_CN/", lang = "zh-Hant" },
    { name = "中文(繁體)", link = "/zh_TW/", lang = "zh-TW" },
]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/beeware", name = "BeeWare on GitHub" },
    { icon = "fontawesome/brands/mastodon", link = "https://fosstodon.org/@beeware", name = "BeeWare on Mastodon" },
    { icon = "fontawesome/brands/discord", link = "https://beeware.org/bee/chat/", name = "BeeWare on Discord" },
]
generator = false

[project.theme]
name = "material"
language = "en"
logo = "assets/images/brutus-256.png"
favicon = "assets/images/brutus-256.png"
features = [
    "content.tabs.link",
    "toc.follow",
    "navigation.indexes",
    "navigation.footer",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "search.suggest",
    "search.highlight",
    "search.share",
]
custom_dir = "overrides"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
# Python Markdown Extensions
attr_list = {}
# Enables easy em and en dashes.
smarty.smart_quotes = false
toc.permalink = true
toc.title = "On this page"
# PyMdown Extensions
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.blocks.caption = {}
# Enables admonitions.
pymdownx.blocks.admonition.types = [
    "note",
    "abstract",
    "info",
    "tip",
    "success",
    "question",
    "warning",
    "failure",
    "danger",
    "bug",
    "example",
    "quote",
]
# Enables collapsible content.
pymdownx.blocks.details.types = [
    { name = "details-note", class = "note" },
    { name = "details-abstract", class = "abstract" },
    { name = "details-info", class = "info" },
    { name = "details-tip", class = "tip" },
    { name = "details-success", class = "success" },
    { name = "details-question", class = "question" },
    { name = "details-warning", class = "warning" },
    { name = "details-failure", class = "failure" },
    { name = "details-danger", class = "danger" },
    { name = "details-bug", class = "bug" },
    { name = "details-example", class = "example" },
    { name = "details-quote", class = "quote" },
]
pymdownx.blocks.tab.alternate_style = true
# Among other things, enables GitHub shorthand references.
pymdownx.magiclink.provider = "github"
pymdownx.magiclink.user = "beeware"
pymdownx.magiclink.repo = "toga"
pymdownx.magiclink.repo_url_shortener = true
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.normalize_issue_symbols = true
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.url_download = true
pymdownx.snippets.check_paths = true

[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.macros]

[project.plugins.redirects.redirect_maps]
# Old versioned RTD paths.
"latest/tutorial/tutorial-1.md" = "tutorial/tutorial-1.md"
"latest.md" = "index.md"
# Old RTD language paths that must continue to exist
"en/latest.md" = "index.md"
"en/latest/tutorial/tutorial-1.md" = "tutorial/tutorial-1.md"
"zh-cn/latest.md" = "https://tutorial.beeware.org/zh_CN"
"zh-tw/latest.md" = "https://tutorial.beeware.org/zh_TW"
